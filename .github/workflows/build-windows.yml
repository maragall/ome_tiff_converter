name: Build Windows .exe

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller installer/ome_tiff_converter.spec --noconfirm --distpath dist --workpath build --clean

      - name: Smoke-test the built .exe
        shell: pwsh
        run: |
          dist\ome_tiff_converter.exe --smoke-test
        # If the smoke tests fail (missing dep, can't load Qt plugin, parse
        # broken in the bundle, conversion broken), the workflow fails here.

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ome-tiff-converter-windows
          path: dist/ome_tiff_converter.exe
          if-no-files-found: error
